<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ゴミ収集カレンダー</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      line-height: 1.7;
      background:#fafafa;
      color:#222;
    }
    .card {
      max-width:560px;
      margin:auto;
      background:white;
      padding:24px;
      border-radius:14px;
      box-shadow:0 4px 18px rgba(0,0,0,0.08);
      text-align:center;
    }
    h1 { font-size:22px; margin: 0 0 10px; }
    p { margin: 10px 0; }
    .btn {
      display:inline-block;
      margin-top:16px;
      padding:14px 18px;
      background:#2d7ff9;
      color:white;
      text-decoration:none;
      border-radius:10px;
      font-weight:700;
    }
    .btn.secondary {
      background:#444;
      margin-left:8px;
    }
    .hint {
      margin-top:14px;
      font-size:13px;
      color:#555;
      text-align:left;
      background:#f4f4f4;
      padding:12px 14px;
      border-radius:10px;
    }
    .small {
      font-size: 12px;
      color:#666;
      margin-top: 14px;
      text-align:left;
    }
    code {
      background:#eee;
      padding:3px 6px;
      border-radius:6px;
    }
    .pill {
      display:inline-block;
      font-size:12px;
      padding:4px 8px;
      border-radius:999px;
      background:#eef3ff;
      color:#2457b2;
      margin-bottom:10px;
    }
  </style>
</head>

<body>
<div class="card">

  <div class="pill" id="deviceLabel">端末判定中…</div>

  <h1>🗓 ゴミ収集カレンダー</h1>
  <p>ボタンを押すだけで、収集日がスマホのカレンダーに入ります。</p>

  <div id="actions" style="margin-top:6px;"></div>

  <div class="hint" id="hintBox" style="display:none;"></div>

  <div class="small">
    <p>うまくいかない場合は、次を試してください：</p>
    <ul>
      <li>PCのGoogleカレンダー → 設定 → <b>インポート</b> から <code>.ics</code> を取り込み</li>
      <li>または下の「httpsで開く」を押して、ファイルから追加</li>
    </ul>
    <p>
      <a href="https://yasunarick-cmd.github.io/oita-gomi-calendar/oita_gomi_2026-2027.ics">
        httpsで開く（ICSファイル）
      </a>
    </p>
  </div>

</div>

<script>
(function () {
  const ICS_HTTPS = "https://yasunarick-cmd.github.io/oita-gomi-calendar/oita_gomi_2026-2027.ics";
  const ICS_WEBCAL = "webcal://yasunarick-cmd.github.io/oita-gomi-calendar/oita_gomi_2026-2027.ics";

  const ua = navigator.userAgent || "";
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isAndroid = /Android/.test(ua);

  const deviceLabel = document.getElementById("deviceLabel");
  const actions = document.getElementById("actions");
  const hintBox = document.getElementById("hintBox");

  function setActions(html) {
    actions.innerHTML = html;
  }
  function setHint(html) {
    hintBox.style.display = "block";
    hintBox.innerHTML = html;
  }

  if (isIOS) {
    deviceLabel.textContent = "iPhone / iPad と判定しました";
    setActions(
      `<a class="btn" href="${ICS_WEBCAL}">カレンダーを購読（おすすめ）</a>
       <a class="btn secondary" href="${ICS_HTTPS}">ファイルから追加</a>`
    );
    setHint(
      `<b>手順：</b>「購読」→「追加」で完了。<br>
       ※ 端末設定により「ファイルから追加」の方が確実な場合があります。`
    );
  } else if (isAndroid) {
    deviceLabel.textContent = "Android と判定しました";
    setActions(
      `<a class="btn" href="${ICS_HTTPS}">ICSを開く（推奨）</a>`
    );
    setHint(
      `<b>手順：</b>リンクを開く → ダウンロード → カレンダーに追加。<br>
       うまくいかない場合は、PCのGoogleカレンダーで「インポート」を使うのが確実です。`
    );
  } else {
    deviceLabel.textContent = "PC / その他の端末と判定しました";
    setActions(
      `<a class="btn" href="${ICS_HTTPS}">ICSを開く</a>`
    );
    setHint(
      `<b>PCの方：</b>Googleカレンダー → 設定 → <b>インポート</b> から <code>.ics</code> を取り込んでください。`
    );
  }
})();
</script>

</body>
</html>
